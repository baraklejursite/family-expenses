<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Spese Famiglia</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #f0f2f5; color: #1a1a2e; }
  header { background: #16213e; color: white; padding: 20px 24px; display: flex; align-items: center; gap: 12px; }
  header h1 { font-size: 1.4rem; font-weight: 600; }
  header span { font-size: 1.6rem; }
  .container { max-width: 1100px; margin: 0 auto; padding: 24px 16px; }
  .cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 16px; margin-bottom: 24px; }
  .card { background: white; border-radius: 12px; padding: 20px; box-shadow: 0 1px 4px rgba(0,0,0,.08); }
  .card .label { font-size: 0.78rem; color: #666; text-transform: uppercase; letter-spacing: .5px; margin-bottom: 6px; }
  .card .value { font-size: 2rem; font-weight: 700; color: #16213e; }
  .card .sub { font-size: 0.82rem; color: #888; margin-top: 4px; }
  .card.accent .value { color: #e94560; }
  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-bottom: 24px; }
  @media(max-width:700px){ .grid2 { grid-template-columns: 1fr; } }
  .panel { background: white; border-radius: 12px; padding: 20px; box-shadow: 0 1px 4px rgba(0,0,0,.08); }
  .panel h2 { font-size: 0.95rem; font-weight: 600; color: #333; margin-bottom: 16px; }
  .chart-wrap { position: relative; height: 220px; }
  table { width: 100%; border-collapse: collapse; font-size: 0.88rem; }
  th { text-align: left; color: #888; font-weight: 500; padding: 6px 8px; border-bottom: 1px solid #eee; }
  td { padding: 10px 8px; border-bottom: 1px solid #f5f5f5; }
  tr:last-child td { border-bottom: none; }
  tr:hover td { background: #fafafa; cursor: pointer; }
  .badge { display: inline-block; padding: 2px 8px; border-radius: 20px; font-size: 0.75rem; font-weight: 500; }
  .cat-bar { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; }
  .cat-bar .name { width: 130px; font-size: 0.83rem; color: #444; flex-shrink: 0; }
  .cat-bar .bar-wrap { flex: 1; background: #f0f0f0; border-radius: 4px; height: 10px; }
  .cat-bar .bar-fill { height: 10px; border-radius: 4px; background: #e94560; transition: width .4s; }
  .cat-bar .amount { width: 70px; text-align: right; font-size: 0.83rem; font-weight: 600; }
  .modal-bg { display: none; position: fixed; inset: 0; background: rgba(0,0,0,.4); z-index: 100; align-items: center; justify-content: center; }
  .modal-bg.open { display: flex; }
  .modal { background: white; border-radius: 12px; padding: 24px; max-width: 480px; width: 90%; max-height: 80vh; overflow-y: auto; }
  .modal h3 { margin-bottom: 16px; }
  .modal-close { float: right; background: none; border: none; font-size: 1.4rem; cursor: pointer; color: #666; }
  .loading { text-align: center; padding: 40px; color: #888; }
</style>
</head>
<body>
<header>
  <span>🏠</span>
  <h1>Spese Famiglia</h1>
</header>

<div class="container">
  <div class="cards" id="cards"><div class="loading">Caricamento...</div></div>
  <div class="grid2">
    <div class="panel">
      <h2>Spesa mensile (ultimi 12 mesi)</h2>
      <div class="chart-wrap"><canvas id="monthChart"></canvas></div>
    </div>
    <div class="panel">
      <h2>Per categoria (anno corrente)</h2>
      <div id="catBars"><div class="loading">Caricamento...</div></div>
    </div>
  </div>
  <div class="panel">
    <h2>Scontrini recenti</h2>
    <table>
      <thead><tr><th>Data</th><th>Negozio</th><th>Articoli</th><th style="text-align:right">Totale</th></tr></thead>
      <tbody id="receiptsTable"><tr><td colspan="4" class="loading">Caricamento...</td></tr></tbody>
    </table>
  </div>
</div>

<div class="modal-bg" id="modalBg" onclick="closeModal(event)">
  <div class="modal" id="modal">
    <button class="modal-close" onclick="closeModal()">×</button>
    <h3 id="modalTitle"></h3>
    <div id="modalBody"></div>
  </div>
</div>

<script>
const COLORS = ['#e94560','#0f3460','#533483','#e2b714','#2ec4b6','#ff9f1c','#cbf3f0','#a8dadc'];
const CAT_COLORS = {
  'Alimentari':'#e94560','Bevande':'#0f3460','Latticini':'#533483',
  'Carne/Pesce':'#e2b714','Frutta/Verdura':'#2ec4b6','Pulizia':'#ff9f1c','Igiene':'#a8dadc','Altro':'#888'
};
let monthChart = null;

async function load() {
  const [summary, receipts] = await Promise.all([
    fetch('/api/summary').then(r => r.json()),
    fetch('/api/receipts').then(r => r.json()),
  ]);
  renderCards(summary);
  renderMonthChart(summary.months);
  renderCategories(summary.year_categories);
  renderReceipts(receipts);
}

function fmt(n) { return '€' + (n||0).toFixed(2).replace('.', ','); }

function renderCards(s) {
  const m = s.current_month;
  const now = new Date(s.current_date);
  const monthName = now.toLocaleString('it-IT', {month:'long', year:'numeric'});
  const prevMonth = s.months[1];
  const diff = prevMonth ? ((m.total - prevMonth.total) / (prevMonth.total||1) * 100) : null;
  const diffTxt = diff !== null ? (diff >= 0 ? `▲ ${diff.toFixed(0)}%` : `▼ ${Math.abs(diff).toFixed(0)}%`) + ' vs mese scorso' : '';

  document.getElementById('cards').innerHTML = `
    <div class="card accent">
      <div class="label">Spesa ${monthName}</div>
      <div class="value">${fmt(m.total)}</div>
      <div class="sub">${diffTxt}</div>
    </div>
    <div class="card">
      <div class="label">Scontrini questo mese</div>
      <div class="value">${m.count}</div>
      <div class="sub">Media ${m.count ? fmt(m.total / m.count) : '€0,00'} a scontrino</div>
    </div>
    <div class="card">
      <div class="label">Top categoria</div>
      <div class="value" style="font-size:1.2rem">${m.categories[0]?.category || '—'}</div>
      <div class="sub">${fmt(m.categories[0]?.total)}</div>
    </div>
    <div class="card">
      <div class="label">Anno corrente</div>
      <div class="value">${fmt(s.months.reduce((a,b)=>a+(b.total||0),0))}</div>
      <div class="sub">${s.months.length} mesi registrati</div>
    </div>
  `;
}

function renderMonthChart(months) {
  const sorted = [...months].reverse();
  const labels = sorted.map(m => {
    const [y, mo] = m.month.split('-');
    return new Date(y, mo-1).toLocaleString('it-IT', {month:'short', year:'2-digit'});
  });
  const data = sorted.map(m => m.total || 0);
  if (monthChart) monthChart.destroy();
  monthChart = new Chart(document.getElementById('monthChart'), {
    type: 'bar',
    data: { labels, datasets: [{ label: 'Spesa (€)', data, backgroundColor: '#e94560', borderRadius: 6 }] },
    options: {
      responsive: true, maintainAspectRatio: false,
      plugins: { legend: { display: false } },
      scales: { y: { beginAtZero: true, ticks: { callback: v => '€'+v } }, x: { grid: { display: false } } }
    }
  });
}

function renderCategories(cats) {
  if (!cats.length) { document.getElementById('catBars').innerHTML = '<p style="color:#888;font-size:.85rem">Nessun dato</p>'; return; }
  const max = cats[0].total;
  document.getElementById('catBars').innerHTML = cats.map(c => `
    <div class="cat-bar">
      <div class="name">${c.category}</div>
      <div class="bar-wrap"><div class="bar-fill" style="width:${(c.total/max*100).toFixed(0)}%;background:${CAT_COLORS[c.category]||'#888'}"></div></div>
      <div class="amount">${fmt(c.total)}</div>
    </div>
  `).join('');
}

function renderReceipts(receipts) {
  if (!receipts.length) { document.getElementById('receiptsTable').innerHTML = '<tr><td colspan="4" style="color:#888;padding:20px">Nessuno scontrino ancora. Invia una foto al bot Telegram!</td></tr>'; return; }
  document.getElementById('receiptsTable').innerHTML = receipts.map(r => `
    <tr onclick="showReceipt(${r.id}, '${(r.store||'').replace(/'/g,"\\'")}', '${r.date}', ${r.total||0})">
      <td>${r.date || '—'}</td>
      <td>${r.store || 'Sconosciuto'}</td>
      <td style="color:#888">—</td>
      <td style="text-align:right;font-weight:600">${fmt(r.total)}</td>
    </tr>
  `).join('');
}

async function showReceipt(id, store, date, total) {
  document.getElementById('modalTitle').textContent = `${store} — ${date}`;
  document.getElementById('modalBody').innerHTML = '<div class="loading">Caricamento articoli...</div>';
  document.getElementById('modalBg').classList.add('open');
  const items = await fetch(`/api/receipts/${id}/items`).then(r => r.json());
  if (!items.length) { document.getElementById('modalBody').innerHTML = '<p style="color:#888">Nessun articolo trovato.</p>'; return; }
  document.getElementById('modalBody').innerHTML = `
    <table>
      <thead><tr><th>Articolo</th><th>Qtà</th><th>Categoria</th><th style="text-align:right">Prezzo</th></tr></thead>
      <tbody>${items.map(i=>`
        <tr>
          <td>${i.name}</td>
          <td>${i.quantity||1}</td>
          <td><span class="badge" style="background:${CAT_COLORS[i.category]||'#eee'}20;color:${CAT_COLORS[i.category]||'#666'}">${i.category}</span></td>
          <td style="text-align:right">${fmt(i.total_price)}</td>
        </tr>
      `).join('')}</tbody>
      <tfoot><tr><td colspan="3" style="font-weight:600;padding-top:8px">Totale</td><td style="text-align:right;font-weight:700;padding-top:8px">${fmt(total)}</td></tr></tfoot>
    </table>`;
}

function closeModal(e) {
  if (!e || e.target === document.getElementById('modalBg')) document.getElementById('modalBg').classList.remove('open');
}

load();
</script>
</body>
</html>
